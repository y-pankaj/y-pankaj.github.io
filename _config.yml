title: Dumping grounds
description: 
author: Pankaj Yadav
avatar: /logo.jpeg
subscribe: false

# email: 

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

paginate: 10

skin: daylight

# Uncomment the below line and set the tracking ID for enabling Google Analytics
#
google_analytics: G-BXS3XY0WT3

# Comments, via giscus -> GitHub Discussions on this repo.
#
# Still to do: enable Discussions on the repo, add a category called Comments
# with the "Announcement" format, install https://github.com/apps/giscus, then
# reload https://giscus.app -- it can only offer the category dropdown once all
# three are true, which is why category_id is blank. Comments render nowhere
# until it is filled in; see _includes/comments.html.
giscus:
  repo: y-pankaj/y-pankaj.github.io
  repo_id: "MDEwOlJlcG9zaXRvcnkzNzc1NTA2NDk="
  category: Comments
  category_id: ""
  mapping: pathname
  # light | dark | preferred_color_scheme. The site pins the daylight skin, so
  # light matches; switch to preferred_color_scheme if `skin` above is removed.
  theme: light

# Jekyll
# ======
exclude:
  - scripts/
  - README.md
  - jekyll-theme-hamilton.gemspec

