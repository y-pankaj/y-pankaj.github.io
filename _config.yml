title: Dumping grounds
description: 
author: Pankaj Yadav
avatar: /logo.jpeg
subscribe: false

# email: 

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

paginate: 10

skin: daylight

# Uncomment the below line and set the tracking ID for enabling Google Analytics
#
google_analytics: G-BXS3XY0WT3

# Comments, via giscus -> GitHub Discussions on this repo.
#
# repo_id and category_id come from https://giscus.app -- paste the repo in,
# pick the "Comments" discussion category, and copy them out of the snippet it
# generates. Comments stay switched off until both are filled in; see
# _includes/comments.html.
giscus:
  repo: y-pankaj/y-pankaj.github.io
  repo_id: ""
  category: Comments
  category_id: ""
  mapping: pathname
  # light | dark | preferred_color_scheme. The site pins the daylight skin, so
  # light matches; switch to preferred_color_scheme if `skin` above is removed.
  theme: light

# Jekyll
# ======
exclude:
  - scripts/
  - README.md
  - jekyll-theme-hamilton.gemspec

# Jekyll SEO Tag (Optional)
