title: Dumping grounds
description: 
author: Pankaj Yadav
avatar: /logo.jpeg
subscribe: false

# email: 

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

paginate: 10

skin: daylight

# Uncomment the below line and set the tracking ID for enabling Google Analytics
#
google_analytics: G-BXS3XY0WT3

# Comments, via giscus -> GitHub Discussions on this repo.
#
# `category` and `category_id` have to name the same category, and both come
# from https://giscus.app. General is the repo's default category; a dedicated
# one in the "Announcement" format would be tidier, since only a maintainer can
# open a discussion there. Moving later is just these two values plus a manual
# re-home of any threads that already exist.
giscus:
  repo: y-pankaj/y-pankaj.github.io
  repo_id: "MDEwOlJlcG9zaXRvcnkzNzc1NTA2NDk="
  category: General
  category_id: "DIC_kwDOFoD3Oc4DFlqG"
  mapping: pathname
  # light | dark | preferred_color_scheme. The site pins the daylight skin, so
  # light matches; switch to preferred_color_scheme if `skin` above is removed.
  theme: light

# Jekyll
# ======
exclude:
  - scripts/
  - README.md
  - jekyll-theme-hamilton.gemspec

