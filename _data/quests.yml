# The side-quest list behind /side-quests/.
#
# Fields
# ------
#   id      required  stable number. It is what the list is numbered by, what
#                     _data/travel.yml points at, and what _data/fitness.json
#                     refers to -- so renumbering breaks links. Add new ones at
#                     the end; never reuse an id.
#   text    required  the quest itself
#   theme   required  body | travel | live | thrill | craft | career
#   done    optional  true once it is done. Tracked quests (see below) also
#                     flip themselves when they reach their target.
#   when    optional  "2023" or "2023-06", shown next to a finished quest
#   note    optional  one line of colour
#   link    optional  { text: ..., url: ... }  -- the receipt
#   see     optional  internal page with more, e.g. /travel/
#   photos  optional  same shape as _data/travel.yml: a list of
#                     { src, caption }. An entry with no `src` renders as a
#                     labelled placeholder tile, so captions can go in now and
#                     the files can follow.
#
#   track   optional  makes the quest self-updating. See _includes/quest-value.html
#                     for the sources that exist:
#                       posts                 -- count of published posts
#                       books                 -- `current` below, until a feed exists
#                       travel.continents     -- distinct continents in _data/travel.yml
#                       travel.countries      -- distinct countries in _data/travel.yml
#                       fitness.longest_run   -- longest single run, km
#                       fitness.bench         -- flat barbell bench, % of target
#                     plus `target`, and `current` for the manual ones.

