name: Sync fitness data

# Pulls the FitNotes export from the Apps Script endpoint, derives
# _data/fitness.json, and commits it if anything actually changed.
#
# Requires one repository secret: FITNOTES_URL -- the Apps Script /exec URL.

on:
  schedule:
    # 18:41 UTC = 00:11 IST, so each day syncs once it is complete.
    # Deliberately off the hour: GitHub's scheduler backs up at :00 and
    # delays runs by up to an hour.
    - cron: '41 18 * * *'
  workflow_dispatch:
  # Re-verify the pipeline whenever the sync machinery itself changes. Also
  # means the very first push registers the workflow with a real run, rather
  # than leaving an Actions tab with nothing in it.
  push:
    branches: [master]
    paths:
      - '.github/workflows/sync-fitness.yml'
      - 'scripts/build_fitness_data.py'

permissions:
  contents: write

# Never let a scheduled run and a manual one race on the same push.
concurrency:
  group: sync-fitness
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the FitNotes export
        env:
          FITNOTES_URL: ${{ secrets.FITNOTES_URL }}
        run: |
          set -euo pipefail
          if [ -z "${FITNOTES_URL:-}" ]; then
            echo "::error::The FITNOTES_URL secret is not set."
            exit 1
          fi

          # Shape check. Never prints the secret, only what is wrong with it.
          # The /dev URL from "Test deployments" only works for accounts with
          # edit access, so it 404s here even though it opens fine in a browser.
          case "$FITNOTES_URL" in
            https://script.google.com/macros/s/*/exec) ;;
            *dev)
              echo "::error::That is the /dev test URL. Use the /exec URL from"
              echo "::error::Deploy > Manage deployments > Web app."
              exit 1 ;;
            *)
              echo "::warning::URL is not the expected"
              echo "::warning::https://script.google.com/macros/s/<ID>/exec form"
              echo "::warning::(length ${#FITNOTES_URL} chars)" ;;
          esac

          # Apps Script /exec 302-redirects to script.googleusercontent.com,
          # so -L is required. Retries cover cold starts. No --fail, so that a
          # bad response can be reported rather than collapsed into exit 22.
          status=$(curl -sS -L --retry 3 --retry-delay 10 --max-time 120 \
            -o fitnotes-response.json -w '%{http_code}' "$FITNOTES_URL")

          if [ "$status" != "200" ]; then
            echo "::error::Apps Script returned HTTP $status"
            echo "--- first 300 bytes of the response ---"
            head -c 300 fitnotes-response.json || true
            echo
            exit 1
          fi
          echo "fetched $(wc -c < fitnotes-response.json) bytes"

      - name: Derive the summary
        # python3 is preinstalled on ubuntu-latest and the script is
        # standard library only, so there is nothing to install.
        # It exits non-zero without writing if the response is not a
        # FitNotes export, or has fewer rows than the archive on disk.
        run: python3 scripts/build_fitness_data.py --in fitnotes-response.json

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          rm -f fitnotes-response.json
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _data/fitness.json _raw/fitnotes.ndjson
          if git diff --cached --quiet; then
            echo 'nothing changed, skipping commit'
            exit 0
          fi
          git commit -m "fitness: sync $(date -u +%F)"
          git push
